# Avahi advertises the add-on's AirPlay receiver (UxPlay) on the local
# network. It only runs with the add-on on the host's network, where Home
# Assistant has its own mDNS responder answering for homeassistant.local,
# so this answers beside it, for its own name.
[server]
host-name=family-airplay
use-ipv4=yes
use-ipv6=yes
# Home Assistant's internal networks.
deny-interfaces=docker0,hassio
enable-dbus=yes
disallow-other-stacks=no
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=no

[publish]
publish-hinfo=no
publish-workstation=no

[reflector]
enable-reflector=no
