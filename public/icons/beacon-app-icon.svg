<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Rounded rect background -->
  <rect width="512" height="512" rx="80" fill="#0f172a"/>

  <!-- Concept A: Simplified Lighthouse. Source viewBox 0 0 64 64, scale = 512/64 = 8 -->
  <g transform="scale(8)">
    <!-- single asymmetric beam, one shape, no repeated arcs -->
    <path d="M32 14 L50 24 L32 20 Z" fill="#f59e0b" opacity="0.9"/>
    <!-- tower: base -> taper -> lamp room, 3 solid shapes total -->
    <path d="M22 50 L42 50 L38 40 L26 40 Z" fill="#f59e0b"/>
    <path d="M26 40 L38 40 L34 20 L30 20 Z" fill="#f8fafc"/>
    <rect x="28" y="16" width="8" height="6" rx="1" fill="#f59e0b"/>
  </g>
</svg>
