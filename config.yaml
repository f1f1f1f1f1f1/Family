name: Family
version: "1.60.1"
slug: family
description: "Family command center for wall-mounted displays"
url: "https://github.com/f1f1f1f1f1f1/Family"
arch:
  - amd64
  - aarch64
  - armv7
startup: application
boot: auto
init: false
ingress: true
# 0: the Supervisor picks a free port (on the host's network, 3000 may be
# taken).
ingress_port: 0
# iPhones, iPads and Macs find AirPlay receivers by mDNS on the local
# network (docs/airplay.md).
host_network: true
panel_icon: mdi:calendar-clock
panel_title: Family
homeassistant_api: true
options:
  theme: "skylight"
  auto_dark_mode: true
  weather_entity: "weather.home"
  photo_directory: "/media/beacon/photos"
  photo_interval: 30
  screen_saver_timeout: 5
  blocked_entities: ""
  parent_pin: ""
  airplay: true
  airplay_name: "Family"
  airplay_password: ""
schema:
  theme: str
  auto_dark_mode: bool
  weather_entity: str
  photo_directory: str
  photo_interval: int
  screen_saver_timeout: int
  blocked_entities: str
  parent_pin: password?
  airplay: bool
  airplay_name: str?
  airplay_password: password?
  # Accept old installations' setting during upgrade, but do not use it.
  allowed_entities: str?
