name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Builds the add-on image the way Home Assistant does on each install (same
  # Dockerfile and base image; there's no build.yaml), so a broken Dockerfile
  # fails here instead of as a failed update. amd64 only: the arm images come
  # from the same Dockerfile and are slow to build under emulation.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build add-on image
        run: docker build --platform linux/amd64 --tag family-addon:ci .
