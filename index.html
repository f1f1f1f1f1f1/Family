<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf9f6" />
    <meta name="description" content="Family calendar display" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Home-screen app support: the first for Chrome, the apple-* ones for iOS -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Family" />
    <link rel="apple-touch-icon" href="/icons/beacon-app-icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/beacon-app-icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/beacon-favicon-32.png" />

    <!-- Inter, loaded without holding up startup (media="print" doesn't
         block): a display with no internet access would otherwise wait for
         Google before showing anything. Until it arrives, and offline, the
         font stacks' system fonts are used. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'" />

    <title>Family</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
